<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda VGT</title>
<style>
:root{
  --bg:#f5f6f8;
  --panel:#ffffff;
  --text:#172033;
  --muted:#6b7280;
  --border:#dde2e8;
  --shadow:0 8px 28px rgba(16,24,40,.07);
  --radius:16px;
  --demarcacion:#7a1b8d;
  --descentralizacion:#1538a8;
  --dialogo:#eb6b2f;
  --riesgo:#2492e8;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
}
.page{max-width:1800px;margin:0 auto;padding:22px}
.header{
  display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px
}
.title-wrap h1{margin:0;font-size:26px;line-height:1.15}
.title-wrap p{margin:6px 0 0;color:var(--muted);font-size:13px}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 11px;border:1px solid #d9e0e7;border-radius:999px;background:#fff;
  font-size:12px;color:#475467
}
.badge-dot{width:8px;height:8px;border-radius:50%;background:#22c55e}

.filters{
  display:grid;
  grid-template-columns: 260px 1fr 1fr 1fr 160px;
  gap:12px;
  align-items:end;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}
.filter-group label{
  display:block;font-size:12px;font-weight:700;color:#475467;margin-bottom:7px
}
.date-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select{
  width:100%;height:42px;border:1px solid #d5dbe3;border-radius:10px;
  background:#fff;padding:0 11px;color:#253047;outline:none
}
input:focus,select:focus{border-color:#94a3b8;box-shadow:0 0 0 3px rgba(148,163,184,.15)}
.kpi{
  background:#111827;color:white;border-radius:12px;padding:11px 14px;height:68px;
  display:flex;flex-direction:column;justify-content:center
}
.kpi span{font-size:11px;opacity:.72;text-transform:uppercase;letter-spacing:.08em}
.kpi strong{font-size:25px;margin-top:2px}

.main{
  display:grid;
  grid-template-columns: 360px minmax(0,1fr);
  gap:16px;
  align-items:start
}
.agenda-panel,.board-shell{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)
}
.agenda-panel{overflow:hidden}
.agenda-head{padding:16px;border-bottom:1px solid var(--border)}
.agenda-head-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.agenda-title{font-weight:800}
.month-nav{display:flex;align-items:center;gap:7px;margin-top:12px}
.navbtn{
  width:34px;height:34px;border:1px solid var(--border);background:#fff;border-radius:9px;cursor:pointer;
  font-size:18px;color:#334155
}
.navbtn:hover{background:#f8fafc}
.month-label{font-weight:800;flex:1;text-align:center;text-transform:capitalize}
.todaybtn{
  border:1px solid var(--border);background:#fff;border-radius:9px;padding:8px 10px;cursor:pointer;
  font-size:12px;color:#475467
}
.agenda-list{max-height:635px;overflow:auto;padding:8px 0}
.day-block{border-bottom:1px solid #edf0f3}
.day-title{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 14px;background:#f7f8fa;font-weight:800;font-size:13px
}
.agenda-item{
  display:flex;align-items:flex-start;gap:9px;padding:10px 14px;cursor:pointer;
  border-top:1px solid #f1f3f5
}
.agenda-item:hover{background:#fbfcfd}
.dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:0 0 auto}
.agenda-item-main{min-width:0}
.agenda-item-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agenda-item-sub{font-size:11px;color:var(--muted);margin-top:3px}
.legend{padding:12px 14px;display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--border);font-size:10px;color:#4b5563}
.legend span{display:flex;align-items:center;gap:5px}

.board-shell{padding:10px;overflow:hidden}
.board{
  display:grid;
  grid-template-columns:repeat(4,minmax(245px,1fr));
  gap:10px;
  overflow-x:auto;
}
.column{
  background:#f3f2ef;border:1px solid #dedbd6;border-radius:14px;padding:10px;min-height:690px
}
.column-title{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:13px;font-weight:900;line-height:1.15;padding:2px 3px 10px
}
.column-title .count{
  display:inline-flex;min-width:24px;height:24px;align-items:center;justify-content:center;
  border-radius:999px;background:#fff;border:1px solid #ddd;font-size:11px;color:#586174
}
.card{
  background:#fff;border:1px solid #dadde2;border-radius:12px;padding:12px;margin-bottom:10px;
  cursor:pointer;transition:.18s ease;box-shadow:0 1px 2px rgba(16,24,40,.03);
  border-left:4px solid var(--accent,#94a3b8)
}
.card:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(16,24,40,.08)}
.card h3{font-size:13px;line-height:1.25;margin:0 0 10px}
.meta{display:grid;grid-template-columns:70px 1fr;gap:7px 7px;font-size:11px;line-height:1.25}
.meta b{font-size:10px;color:#1f2937}
.meta span{color:#526071;overflow-wrap:anywhere}

.empty{
  padding:30px 16px;color:#9aa3af;text-align:center;font-size:12px
}
.toolbar-note{font-size:11px;color:#7a8494;margin-top:6px}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(15,23,42,.42);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:50
}
.modal-backdrop.open{display:flex}
.modal{
  width:min(620px,100%);background:#fff;border-radius:18px;box-shadow:0 25px 80px rgba(0,0,0,.25);
  overflow:hidden
}
.modal-head{
  padding:18px 20px;color:#fff;background:#1f2937;display:flex;justify-content:space-between;gap:15px
}
.modal-head h2{margin:0;font-size:18px}
.close{border:none;background:rgba(255,255,255,.14);color:white;width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:18px}
.modal-body{padding:18px 20px}
.modal-grid{display:grid;grid-template-columns:140px 1fr;gap:10px 14px;font-size:13px}
.modal-grid b{color:#344054}
.modal-grid div{padding-bottom:8px;border-bottom:1px solid #eef1f4}
.modal-footer{padding:13px 20px;background:#f8fafc;color:#667085;font-size:11px}

@media(max-width:1250px){
  .filters{grid-template-columns:1fr 1fr 1fr}
  .kpi{grid-column:auto}
  .main{grid-template-columns:320px minmax(0,1fr)}
}
@media(max-width:900px){
  .page{padding:12px}
  .header{flex-direction:column}
  .filters{grid-template-columns:1fr 1fr}
  .main{grid-template-columns:1fr}
  .agenda-list{max-height:420px}
}
@media(max-width:560px){
  .filters{grid-template-columns:1fr}
  .date-pair{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="title-wrap">
      <h1>Agenda del Viceministerio de Gobernanza Territorial</h1>
      <p>Vista integrada de actividades por Secretaría</p>
    </div>
    <div class="badge"><span class="badge-dot"></span> Prototipo con datos del Excel cargado</div>
  </div>

  <section class="filters">
    <div class="filter-group">
      <label>Fecha</label>
      <div class="date-pair">
        <input id="dateFrom" type="date" value="2026-10-01">
        <input id="dateTo" type="date" value="2026-10-31">
      </div>
    </div>
    <div class="filter-group">
      <label>Actividad</label>
      <select id="activityFilter"><option value="">Todas</option></select>
    </div>
    <div class="filter-group">
      <label>Modalidad</label>
      <select id="modeFilter"><option value="">Todas</option></select>
    </div>
    <div class="filter-group">
      <label>Secretaría</label>
      <select id="secretaryFilter"><option value="">Todas</option></select>
    </div>
    <div class="kpi"><span>Actividades</span><strong id="kpi">0</strong></div>
  </section>

  <main class="main">
    <aside class="agenda-panel">
      <div class="agenda-head">
        <div class="agenda-head-top">
          <div>
            <div class="agenda-title">Agenda</div>
            <div class="toolbar-note">Selecciona una actividad para ver el detalle.</div>
          </div>
        </div>
        <div class="month-nav">
          <button class="navbtn" id="prevMonth">‹</button>
          <div class="month-label" id="monthLabel"></div>
          <button class="navbtn" id="nextMonth">›</button>
          <button class="todaybtn" id="todayMonth">Oct. 2026</button>
        </div>
      </div>
      <div class="agenda-list" id="agendaList"></div>
      <div class="legend" id="legend"></div>
    </aside>

    <section class="board-shell">
      <div class="board" id="board"></div>
    </section>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="close" id="modalClose">×</button>
    </div>
    <div class="modal-body"><div class="modal-grid" id="modalGrid"></div></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script>
const DATA = [{"id": 1, "secretaria": "Descentralización", "fecha": "2026-10-08", "lugar": "Trujillo", "modalidad": "Presencial", "actividad": "Viaje / Comisión de servicio", "asunto": "Reunión GT Ruta del León", "promotor": "MINCETUR", "otros": "Oficio N° 324-2026-MINCETUR, Retorno: Sábado 10 octubre", "registra": "Sol"}, {"id": 2, "secretaria": "Gestión del Riesgo de Desastres", "fecha": "2026-10-03", "lugar": "COEN", "modalidad": "Presencial", "actividad": "Reunión", "asunto": "Coordinar ayuda vinculada al FEN", "promotor": "INDECI", "otros": "Participa: Embajada EEUU", "registra": "Sol"}, {"id": 3, "secretaria": "Gestión Social y Diálogo", "fecha": "2026-10-09", "lugar": "Sala Acuerdo Nacional", "modalidad": "Presencial", "actividad": "Reunión", "asunto": "Problemática combustible Loreto", "promotor": "Sec Coordinación Interinstitucional", "otros": "Participa: MIDIS, MEF, DICAPI y MTC", "registra": "Sol"}, {"id": 4, "secretaria": "Demarcación y Organización Territorial", "fecha": "2026-10-12", "lugar": "Congreso de la República", "modalidad": "Presencial", "actividad": "Exposición / Presentación", "asunto": "Límites Moquegua Tacna", "promotor": "Diputados - Comisión Descentralización", "otros": "Cita: Diputada Carmela Paucará", "registra": "Sol"}, {"id": 7, "secretaria": "Gestión del Riesgo de Desastres", "fecha": "2026-10-04", "lugar": "Puente Piedra", "modalidad": "Presencial", "actividad": "Reunión", "asunto": "Sobre incendios", "promotor": "Diputado Retto", "otros": "Participa el VGT", "registra": "Cecilia"}, {"id": 8, "secretaria": "Descentralización", "fecha": "2026-10-06", "lugar": "Edificio Schell", "modalidad": "Presencial", "actividad": "Reunión", "asunto": "Comunidad Campesina Santa Rosa de Pitic", "promotor": "Defensoría del Pueblo", "otros": "Participa Senado", "registra": "Sol"}];

const SECRETARIES = [
  "Demarcación y Organización Territorial",
  "Descentralización",
  "Gestión Social y Diálogo",
  "Gestión del Riesgo de Desastres"
];

const COLORS = {
  "Demarcación y Organización Territorial":"#7a1b8d",
  "Descentralización":"#1538a8",
  "Gestión Social y Diálogo":"#eb6b2f",
  "Gestión del Riesgo de Desastres":"#2492e8"
};

const els = {
  dateFrom: document.getElementById("dateFrom"),
  dateTo: document.getElementById("dateTo"),
  activity: document.getElementById("activityFilter"),
  mode: document.getElementById("modeFilter"),
  secretary: document.getElementById("secretaryFilter"),
  kpi: document.getElementById("kpi"),
  board: document.getElementById("board"),
  agenda: document.getElementById("agendaList"),
  legend: document.getElementById("legend"),
  monthLabel: document.getElementById("monthLabel")
};

let agendaMonth = new Date(2026, 9, 1);

const fmtDate = s => new Intl.DateTimeFormat("es-PE",{
  day:"2-digit",month:"2-digit",year:"numeric"
}).format(new Date(s+"T12:00:00"));

const fmtLongDate = s => new Intl.DateTimeFormat("es-PE",{
  day:"numeric",month:"long",year:"numeric"
}).format(new Date(s+"T12:00:00"));

const weekday = s => new Intl.DateTimeFormat("es-PE",{weekday:"long"})
  .format(new Date(s+"T12:00:00"));

const monthText = d => new Intl.DateTimeFormat("es-PE",{month:"long",year:"numeric"}).format(d);

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function fillSelect(select, values){
  [...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es"))
    .forEach(v=>{
      const o=document.createElement("option");o.value=v;o.textContent=v;select.appendChild(o);
    });
}

fillSelect(els.activity, DATA.map(x=>x.actividad));
fillSelect(els.mode, DATA.map(x=>x.modalidad));
fillSelect(els.secretary, DATA.map(x=>x.secretaria));

els.legend.innerHTML = SECRETARIES.map(s =>
  `<span><i class="dot" style="background:${COLORS[s]}"></i>${esc(s)}</span>`
).join("");

function filteredData(){
  return DATA.filter(x=>{
    const inDate = (!els.dateFrom.value || x.fecha >= els.dateFrom.value) &&
                   (!els.dateTo.value || x.fecha <= els.dateTo.value);
    return inDate &&
      (!els.activity.value || x.actividad === els.activity.value) &&
      (!els.mode.value || x.modalidad === els.mode.value) &&
      (!els.secretary.value || x.secretaria === els.secretary.value);
  }).sort((a,b)=>a.fecha.localeCompare(b.fecha) || a.asunto.localeCompare(b.asunto));
}

function render(){
  const rows = filteredData();
  els.kpi.textContent = rows.length;
  renderBoard(rows);
  renderAgenda(rows);
}

function renderBoard(rows){
  els.board.innerHTML = SECRETARIES.map(sec=>{
    const items = rows.filter(x=>x.secretaria===sec);
    const cards = items.length ? items.map(x=>`
      <article class="card" style="--accent:${COLORS[sec]}" data-id="${x.id}">
        <h3>${esc(x.asunto)}</h3>
        <div class="meta">
          <b>Fecha:</b><span>${fmtDate(x.fecha)}</span>
          <b>Lugar:</b><span>${esc(x.lugar)}</span>
          <b>Actividad:</b><span>${esc(x.actividad)}</span>
          <b>Modalidad:</b><span>${esc(x.modalidad)}</span>
          <b>Promotor:</b><span>${esc(x.promotor)}</span>
          <b>Otros:</b><span>${esc(x.otros)}</span>
        </div>
      </article>`).join("") : `<div class="empty">Sin actividades con los filtros actuales</div>`;
    return `
      <section class="column">
        <div class="column-title">
          <span>${esc(sec)}</span>
          <span class="count">${items.length}</span>
        </div>
        ${cards}
      </section>`;
  }).join("");
  document.querySelectorAll(".card").forEach(c=>c.addEventListener("click",()=>openModal(+c.dataset.id)));
}

function renderAgenda(rows){
  els.monthLabel.textContent = monthText(agendaMonth);
  const y=agendaMonth.getFullYear(), m=agendaMonth.getMonth();
  const monthRows = rows.filter(x=>{
    const d=new Date(x.fecha+"T12:00:00");
    return d.getFullYear()===y && d.getMonth()===m;
  });

  const groups = {};
  monthRows.forEach(x => (groups[x.fecha] ||= []).push(x));
  const keys = Object.keys(groups).sort();

  if(!keys.length){
    els.agenda.innerHTML = `<div class="empty">No hay actividades para ${esc(monthText(agendaMonth))}.</div>`;
    return;
  }

  els.agenda.innerHTML = keys.map(date=>{
    const items = groups[date].map(x=>`
      <div class="agenda-item" data-id="${x.id}">
        <span class="dot" style="background:${COLORS[x.secretaria]}"></span>
        <div class="agenda-item-main">
          <div class="agenda-item-title">${esc(x.asunto)}</div>
          <div class="agenda-item-sub">${esc(x.secretaria)} · ${esc(x.lugar)}</div>
        </div>
      </div>`).join("");
    return `
      <section class="day-block">
        <div class="day-title">
          <span>${fmtLongDate(date)}</span>
          <span>${weekday(date)}</span>
        </div>
        ${items}
      </section>`;
  }).join("");

  document.querySelectorAll(".agenda-item").forEach(c=>c.addEventListener("click",()=>openModal(+c.dataset.id)));
}

function openModal(id){
  const x=DATA.find(r=>r.id===id);
  if(!x) return;
  document.getElementById("modalTitle").textContent=x.asunto;
  document.querySelector(".modal-head").style.background=COLORS[x.secretaria] || "#1f2937";
  document.getElementById("modalGrid").innerHTML = `
    <b>Secretaría</b><div>${esc(x.secretaria)}</div>
    <b>Fecha</b><div>${fmtLongDate(x.fecha)}</div>
    <b>Lugar</b><div>${esc(x.lugar)}</div>
    <b>Modalidad</b><div>${esc(x.modalidad)}</div>
    <b>Actividad</b><div>${esc(x.actividad)}</div>
    <b>Promotor</b><div>${esc(x.promotor)}</div>
    <b>Otros</b><div>${esc(x.otros)}</div>
  `;
  document.getElementById("modalFooter").textContent = `Registrado por: ${x.registra || "—"}`;
  document.getElementById("modalBackdrop").classList.add("open");
}

document.getElementById("modalClose").onclick=()=>document.getElementById("modalBackdrop").classList.remove("open");
document.getElementById("modalBackdrop").addEventListener("click",e=>{
  if(e.target.id==="modalBackdrop") e.currentTarget.classList.remove("open");
});

[els.dateFrom,els.dateTo,els.activity,els.mode,els.secretary].forEach(e=>e.addEventListener("change",render));

document.getElementById("prevMonth").onclick=()=>{
  agendaMonth=new Date(agendaMonth.getFullYear(),agendaMonth.getMonth()-1,1);renderAgenda(filteredData());
};
document.getElementById("nextMonth").onclick=()=>{
  agendaMonth=new Date(agendaMonth.getFullYear(),agendaMonth.getMonth()+1,1);renderAgenda(filteredData());
};
document.getElementById("todayMonth").onclick=()=>{
  agendaMonth=new Date(2026,9,1);renderAgenda(filteredData());
};

render();
</script>
</body>
</html>
